<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | eShop'">eShop</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary
mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/static}">🛒 eShop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link"
                                        th:href="@{/products}">Sản phẩm</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       data-bs-toggle="dropdown">Quản trị</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item"
                               th:href="@{/admin/categories}">Danh mục</a></li>
                        <li><a class="dropdown-item"
                               th:href="@{/admin/products}">Sản phẩm</a></li>
                    </ul>
                </li>
            </ul>
            <form class="d-flex" th:action="@{/products}" method="get">
                <input class="form-control me-2" name="keyword" placeholder="Tìm
sản phẩm..." th:value="${keyword}">
                <button class="btn btn-light" type="submit">Tìm</button>
            </form>

        </div>
    </div>
</nav>
<div th:fragment="alerts">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade
show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<footer th:fragment="footer" class="border-top mt-5 py-3 text-center text-muted
small">
    eShop – Demo Spring Boot · Thymeleaf · JPA · MariaDB
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
</footer>
</body>
</html>
